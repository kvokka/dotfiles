name: ci

on:
  push:
    # The smoke test is testing only chezmoi config, this elliminates waste of resources
    paths:
    - .github/workflows/**
    - homedir/.chezmoiscripts/**
    - homedir/.chezmoi*
    - homedir/dot_config/mise/**
    - .chezmoi*
  pull_request:
  workflow_dispatch:
    inputs:
      full:
        description: 'Run full installation (same as pushing the "full" tag)'
        type: boolean
        default: true

jobs:
  clone-and-install:
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/vscode/devcontainers/base:ubuntu-24.04
      env:
        CODESPACES: true
    steps:
        # The event carries the trigger: the workflow_dispatch input, or the
        # ref of the pushed `full` tag. Reading it from the event needs no
        # checkout, and `git tag --points-at` inside the container hits
        # `detected dubious ownership` and silently reports no tag.
      - name: Detect full mode
        run: |
          if [ "${{ inputs.full || (github.ref_type == 'tag' && github.ref_name == 'full') }}" = "true" ]; then
            echo "::notice::Running FULL installation"
          else
            # Light mode: mise bootstrap leaves the host packages and the login
            # shell alone, and installs only the tools the smoke test runs.
            {
              echo "DOTFILES_BOOTSTRAP_SKIP=packages,user,tools"
              echo "DOTFILES_BOOTSTRAP_TOOLS=chezmoi oh-my-posh zoxide"
            } >> "$GITHUB_ENV"
            echo "::notice::Running LIGHT installation (push the 'full' tag for the complete run)"
          fi

      - name: Install
        run: |
          sh -c "$(curl -fsLS get.chezmoi.io/lb)" -- init --apply --force --purge-binary \
            --branch "${{ github.head_ref || github.ref_name }}" \
            "${{ github.event.pull_request.head.repo.full_name || github.repository }}"

      - run: "tree -a -L 2 $HOME"

      - name: smoke test
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          mise --version
          mise bootstrap status
          ~/.local/share/mise/shims/chezmoi --version
          ~/.local/share/mise/shims/chezmoi data

# See https://pre-commit.com for more information
# See https://pre-commit.com/hooks.html for more hooks
# A hook that names no stages runs only before a commit, not in the post-commit and post-merge runs.
default_stages: [pre-commit, manual]
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-added-large-files
      - id: check-yaml
      - id: check-json
      - id: check-toml
      - id: check-xml
      - id: mixed-line-ending
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-merge-conflict
      - id: check-shebang-scripts-are-executable
      - id: debug-statements
      - id: detect-private-key
      - id: forbid-submodules
  - repo: https://gitlab.com/bmares/check-json5
    rev: v1.0.0
    hooks:
    - id: check-json5
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks
        entry: gitleaks protect -v --redact --staged
        require_serial: true
  - repo: https://github.com/hadolint/hadolint
    rev: v2.15.1
    hooks:
      - id: hadolint
  # repowise's index follows the repo after each commit and merge (a fast-forward merge makes no commit), in the
  # background; it is a no-op where repowise has not indexed the checkout (no .repowise/state.json).
  - repo: local
    hooks:
      - id: repowise-update
        name: repowise update (background)
        language: system
        entry: sh -c '[ -f .repowise/state.json ] && command -v repowise >/dev/null || exit 0; nohup repowise update >> .repowise/.update.log 2>&1 < /dev/null &'
        stages: [post-commit, post-merge]
        always_run: true
        pass_filenames: false

#:schema https://raw.githubusercontent.com/Dicklesworthstone/destructive_command_guard/main/config.schema.json
# Destructive Command Guard. core.git and core.filesystem are always on and
# system.disk is on by default; everything else is opt-in. Verify ids with
# `dcg packs`.

[packs]
enabled = [
  "containers.docker",        # docker system prune, volume rm, ...
  "database.postgresql",      # DROP TABLE / TRUNCATE
  "cloud.gcp",                # gcloud ... delete
  "remote.rsync",             # rsync --delete
  "storage.gcs",
  "kubernetes.kubectl",
  "kubernetes.helm",
  "kubernetes.kustomize",
  "cdn.cloudflare_workers",
  "infrastructure.ansible",
  "infrastructure.pulumi",
  "infrastructure.terraform",
  "system.permissions",
  "system.services",
  "cicd.github_actions",
  "secrets.aws_secrets",
  "secrets.vault",
  "secrets.onepassword",
  "platform.github",
  "dns.cloudflare",
  "email.mailgun",
  "email.sendgrid",
  "loadbalancer.haproxy",
  "loadbalancer.nginx",
  "loadbalancer.traefik",
  "messaging.rabbitmq",
  "monitoring.datadog",
  "monitoring.pagerduty",
  "monitoring.prometheus",
  "payment.stripe",
  "search.elasticsearch",
]

[general]
# Agent sessions run unattended (skipDangerousModePermissionPrompt, OpenCode has
# no review prompt): a command dcg could not verify in time is denied, not asked.
unverified_decision = "deny"
# No self-heal: on every call dcg would register its own hook in
# ~/.claude/settings.json and guard every session. dcg runs only from the hooks
# of the repositories fw:init prepared.
self_heal_hook = false

[history]
enabled = true

# The workflow folder of T3: chezmoi writes its files again on every apply, and the rest there are copies made to try a
# workflow out. Removing them is routine cleanup, so the recursive rm rules leave literal targets under it alone; every
# other rule still checks the whole command. Worktrees stay guarded: `git worktree remove` refuses a dirty one.
[rules."core.filesystem:rm-recursive-root-home"]
exempt_target_globs = ["~/.t3/workflows/**"]

[rules."core.filesystem:rm-rf-root-home"]
exempt_target_globs = ["~/.t3/workflows/**"]

[rules."core.filesystem:rm-r-f-separate-root-home"]
exempt_target_globs = ["~/.t3/workflows/**"]

[rules."core.filesystem:rm-recursive-force-root-home"]
exempt_target_globs = ["~/.t3/workflows/**"]

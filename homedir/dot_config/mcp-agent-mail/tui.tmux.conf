# Private tmux server of the agent-mail pitchfork daemon (socket `agent-mail`,
# see ~/.config/mise/config.fw.toml). It holds `am serve-http` with its
# interactive TUI, which am renders only inside the serving process; open it
# with `mise run fw:am-tui`, detach with Ctrl-\ (or C-b d). Quitting the TUI
# (q, Esc Esc, Ctrl-C Ctrl-C) stops the server for every agent until pitchfork
# starts it again.
# `tmux -D` turns exit-empty off; on, the server exits once am has quit, and
# pitchfork restarts the daemon.
set -g exit-empty on
set -g status off
set -as terminal-features ',*:RGB'
set-environment -g COLORTERM truecolor
# The TUI saves its preferences (theme, dismissed hints) to config.env in the
# config dir unless this names another file; the managed config.env stays
# chezmoi's.
set-environment -g CONSOLE_PERSIST_PATH "$HOME/proj/share/agent-mail/tui/config.env"
bind -n 'C-\' detach-client
# am's own Ctrl-D drops the TUI until the next restart ("detach headless").
bind -n C-d display-message "Ctrl-D is off here: detach with Ctrl-\\"
# am looks a pane id from an MCP call up on the tmux server its own TMUX names
# (MCP clients send no X-Tmux-Socket header), and tmux points TMUX and
# TMUX_PANE of every pane at this private server. Without them am uses the
# default server, where the ntm sessions live; with them it binds ntm panes on
# the wrong server, and cleanup_pane_identities deletes their identity files.
new-session -d -s am -x 200 -y 50 "exec env -u TMUX -u TMUX_PANE am serve-http --host 0.0.0.0 --port 8765 --path /mcp/"

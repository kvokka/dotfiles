# Pre-commit hooks for this repository, run by prek through the global git hook.
# This file replaces ~/.config/pre-commit/pre-commit-config.yaml for this repo,
# so the shared hooks are repeated here on purpose. Do not remove gitleaks.
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-added-large-files
      - id: check-yaml
      - id: check-toml
      - id: mixed-line-ending
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-executables-have-shebangs
  - repo: https://gitlab.com/bmares/check-json5
    rev: v1.0.0
    hooks:
      - id: check-json5
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks
        entry: gitleaks protect -v --redact --staged
        require_serial: true
  - repo: https://github.com/rvben/rumdl-pre-commit
    rev: v0.2.37
    hooks:
      - id: rumdl-fmt
  - repo: https://github.com/hadolint/hadolint
    rev: v2.14.0
    hooks:
      - id: hadolint
  - repo: local
    hooks:
      # MCP Agent Mail file-reservation guard. Blocks commits touching files
      # reserved by another agent. Skip once with PREK_SKIP=agent-mail-guard.
      - id: agent-mail-guard
        name: agent-mail-guard
        language: script
        entry: scripts/hooks/agent-mail-guard
        pass_filenames: true
        require_serial: true
        stages: [pre-commit]

      # Ultimate Bug Scanner on staged source files; findings fail the commit.
      # Exit 3 ("nothing scanned", e.g. only docs staged) is turned into success
      # by UBS_ALLOW_NO_SCAN=1. Skip once with PREK_SKIP=ubs.
      - id: ubs
        name: ubs
        language: system
        entry: env UBS_ALLOW_NO_SCAN=1 UBS_SKIP_RUST_BUILD=1 ubs --ci
        pass_filenames: true
        require_serial: true
        types: [text]
        stages: [pre-commit]

# similarity_threshold = 0.70
# window_size = 3

[coordinator]
# Session coordinator (ntm coordinator run): monitoring, digests, auto-assign,
# conflict handling, and the Agent Mail idle-pane nudge (GH#231)
# poll_interval = "5s"  # How often to poll agent status
# digest_interval = "5m0s"  # How often to send digests
# auto_assign = false  # Automatically assign work to idle agents
# idle_threshold = 30.0  # Seconds of inactivity before considering idle
# assign_only_idle = true  # Only assign to truly idle agents
# conflict_notify = true  # Notify when conflicts detected
# conflict_negotiate = false  # Attempt automatic conflict resolution
# send_digests = false  # Send periodic digests to the human agent
# human_agent = "Human"  # Agent name digests are sent to
# mail_nudge = false  # Nudge idle panes that have unread Agent Mail
# nudge_cooldown_seconds = 60  # Minimum seconds between nudges to the same pane
# nudge_message = ""  # Optional override for the nudge prompt (empty = built-in)


# ntm (Named Tmux Manager) configuration, managed by chezmoi.
#
# This file deliberately breaks the "only values that differ from the default"
# rule of the dotfiles: it is ntm's whole reference config (`ntm config init`)
# with every default commented out, so it can be read as documentation. Only
# the uncommented keys are ours. Section headers stay: ntm decodes this file
# over its built-in defaults, so an empty table changes nothing. `ntm config
# init` leaves a few settings out ([retry], [routing], [[command_hooks]]); see
# `ntm config show --json` for the effective values. Regenerate the reference
# on a pin bump with `NTM_CONFIG=<scratch>/config.toml ntm config init`.
#
# ntm writes into this file itself: `ntm coordinator enable|disable <feature>`
# sets a key under [coordinator], pinning or starring a prompt in `ntm palette`
# rewrites [palette_state], and `ntm config set|reset|migrate` edit it. The
# next `chezmoi apply` reverts such a change; keep one by moving it into the
# dotfiles. `ntm level` writes ~/.config/ntm/proficiency.json instead.
#
# A plain file, not a chezmoi template: ntm expands `~` in projects_base, and
# the `{{ }}` in the agent commands below are ntm's own Go templates.

# Base directory for projects
# projects_base = "~/ntm_Dev"
projects_base = "~/proj/active"

# UI Theme (mocha, macchiato, nord, latte, auto)
# theme = "auto"

# Help verbosity (minimal, full)
# help_verbosity = "full"

# Show contextual CLI suggestions

# Path to command palette markdown file (optional)
# If set, loads palette commands from this file instead of [[palette]] entries below
# Searched automatically: ~/.config/ntm/command_palette.md, ./command_palette.md
# palette_file = "~/.config/ntm/command_palette.md"

# Palette state (favorites/pins)
# Managed by the command palette UI (ntm palette)
[palette_state]
# pinned = []
# favorites = []

[agents]
# Commands used to launch each agent type
# (dotfiles) These defaults pass a model and a reasoning effort on the command
# line: Codex panes run gpt-6-astra at xhigh and Claude panes at effort xhigh,
# whatever ~/.codex/config.toml and ~/.claude/settings.json say. Choose per
# spawn with `--cod=N:model:effort` / `--cc=N:model:effort`.
# claude = "{{memLimitPrefix}} claude --dangerously-skip-permissions{{if .Model}} --model {{shellQuote .Model}}{{end}} --effort {{shellQuote (.ReasoningEffort | default \"xhigh\")}}{{if .SystemPromptFile}} --system-prompt-file {{shellQuote .SystemPromptFile}}{{end}}"
# codex = "{{if .SystemPromptFile}}CODEX_SYSTEM_PROMPT=\"$(cat {{shellQuote .SystemPromptFile}})\" {{end}}codex --dangerously-bypass-approvals-and-sandbox -m {{shellQuote (.Model | default \"gpt-6-astra\")}} -c model_reasoning_effort={{shellQuote (.ReasoningEffort | default \"xhigh\")}} -c model_reasoning_summary_format=experimental --search"
# gemini = "{{if .SystemPromptFile}}GEMINI_SYSTEM_MD={{shellQuote .SystemPromptFile}} {{end}}gemini{{if .Model}} --model {{shellQuote .Model}}{{end}} --yolo"
# grok = "grok --always-approve{{if .Model}} --model {{shellQuote .Model}}{{end}}{{if .ReasoningEffort}} --effort {{shellQuote .ReasoningEffort}}{{end}}"
# antigravity = "{{agyBinary}} --model {{shellQuote .Model}} --dangerously-skip-permissions{{if .SystemPromptFile}} --prompt-interactive \"$(cat {{shellQuote .SystemPromptFile}})\"{{end}}"
# cursor = "cursor-agent --yolo{{if .Model}} --model {{shellQuote .Model}}{{end}}"
# windsurf = "windsurf{{if .Model}} --model {{shellQuote .Model}}{{end}}"
# aider = "aider{{if .Model}} --model {{shellQuote .Model}}{{end}}"
# oc = "opencode{{if .Model}} --model {{shellQuote .Model}}{{end}}"

[tmux]
# Tmux-specific settings
# default_panes = 10
# pane_init_delay_ms = 1000  # Delay before send-keys to new panes
# history_limit = 50000       # Scrollback buffer lines per pane

[robot]
# Robot output defaults (JSON/TOON)
# verbosity = "default"

[robot.output]
# Robot output format settings
# format = "json"

[agent_mail]
# Agent Mail server settings for multi-agent coordination
# Environment variables: AGENT_MAIL_URL, AGENT_MAIL_TOKEN, AGENT_MAIL_ENABLED
# enabled = true
# url = "http://127.0.0.1:8765/mcp/"
# token = ""  # Or set AGENT_MAIL_TOKEN env var
# auto_register = true
# If true, ntm starts/stops `am serve-http` for session monitors.
# Default false prevents ntm from hijacking a user-owned Agent Mail server.
# supervisor_enabled = false
# Agent Mail name of each pane in its tmux border, e.g. [BlueLake]; not in `ntm config init`.
pane_badges = true
# pane_badge_format = "[{name}{drift}]{lifecycle}"

[integrations]
# External tool integrations (dcg, caam, caut, etc.)

[integrations.dcg]
# Destructive Command Guard (dcg) settings
# enabled = false
# binary_path = ""  # Auto-detect from PATH
# custom_blocklist = []
# custom_whitelist = []
# dcg_whitelist is legacy; modern DCG handles RCH hook commands directly
# audit_log = "~/.ntm/dcg_audit.log"
# allow_override = true

[integrations.caam]
# Coding Agent Account Manager (caam) settings
# binary_path = ""  # Auto-detect from PATH
# Coordinator auto-failover on detected rate limits (bd-um3uy).
# Doubly opt-in: auto_failover must be true AND failover_providers non-empty.
# auto_failover = false
# reset_horizon_minutes = 30  # Only fail over when the reset is further away than this
# failover_providers = []  # Allow-list ("claude", "openai", "gemini"); empty = none
# Seat selection for UNPINNED spawn/add panes (ntm#319). Unrelated to
# auto_failover above: this only picks which account a NEW pane launches on,
# ranked by earliest reset with headroom. An explicit --persona always wins;
# a pane whose seat cannot be read is skipped with a reason, never pinned
# statically. Off by default.
# seat_selection = false

[integrations.rch]
# Remote Compilation Helper (rch) settings
# enabled = true
# binary_path = ""  # Auto-detect from PATH
# intercept_patterns = [ "^cargo (build|test|check|rustc)", "^go (build|test)", "^npm run build", "^make" ]

[integrations.process_triage]
# Process triage (pt) Bayesian process classification settings
# enabled = true
# check_interval = 30
# idle_threshold = 300
# stuck_threshold = 600
# use_rano_data = true

[integrations.rano]
# rano network observer settings for per-agent API tracking
# enabled = true
# poll_interval_ms = 1000

[integrations.xf]
# X/Twitter archive search (xf) settings
# enabled gates the built-in xf-search palette entry; xf resolves from PATH
# enabled = true

[integrations.bv]
# bv (beads_viewer) graph analysis settings; bv resolves from PATH
# Timeout for each bv subprocess (robot-insights cycle check, triage, plan, drift).
# Override per-invocation with NTM_BV_TIMEOUT=<seconds> (env wins).
# timeout_seconds = 30

[safety]
# Safety profile presets that set defaults for multiple knobs
# profile = "standard"  # standard|safe|paranoid
# profile = "standard"

[preflight]
# Prompt preflight (lint/validation) defaults
# strict = false

[redaction]
# Secrets/PII redaction configuration: off|warn|redact|block
# mode = "warn"
# allowlist = []
# disabled_categories = []
# extra_patterns = { CUSTOM_TOKEN = ["regex"] }

[privacy]
# Privacy mode prevents persistence of sensitive session data
# enabled = false
# disable_prompt_history = true
# disable_event_logs = true
# disable_checkpoints = true
# disable_scrollback_capture = true
# require_explicit_persist = true

[encryption]

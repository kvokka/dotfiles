# Flywheel agent stack (ported from acfs). Linux devcontainer only: this file is
# loaded through the `fw` entry of the env list in miserc.toml, so dropping `fw`
# there disables the whole stack. Every tool is a pinned upstream release; the
# only build is `cm`, from a pinned commit (see [tools."http:cass-memory"]).
#
# Background services run under pitchfork (`mise daemons`), the only mise-native
# supervisor that works without systemd (PID 1 is tini in the container).
# Never run the upstream installers, `am service install`, `sbh install`,
# `dcg install` or `agy install`: chezmoi owns the configs, and the clients' MCP
# servers and hooks are generated by `mise run ai:sync` from ~/.config/rulesync.

# `{{ version }}` in `platforms.*.url` (the `cm` build below). On an older mise
# every command fails with "mise version … is required" instead of a 404 on a
# literal `v{{ version }}.tar.gz`; the chezmoi bootstrap script self-updates.
min_version = "2026.9.12"

[settings]
experimental = true # `mise daemons`

[env]
BV_NO_UPDATE_CHECK = "1"
# No CASS_DATA_DIR or CASS_MEMORY_HOME: cass and cass-memory keep their default
# data dirs, which fw:bootstrap links to ~/proj/share (it outlives the
# container). Both tools have code paths that ignore those variables: the cass
# TUI writes macros under ~/.local/share/coding-agent-search, `cm init` writes a
# literal ~/.cass-memory/playbook.yaml into config.json, and the MCP daemon and
# hooks need not run with mise's environment.
# Semantic model of cass (installed by fw:bootstrap). The multilingual MiniLM,
# not the default English one: on Russian paraphrase queries over our own
# sessions it put the right session in the top 5 for 11 of 16 queries, against
# 4 of 16. It is also the only way cass finds Russian text: its lexical index
# keeps only ASCII and CJK words.
CASS_SEMANTIC_EMBEDDER = "multilingual-minilm"
# Agent Mail archive location. Both the service and `am guard check` (the
# pre-commit guard) resolve it from the environment, so it has to be exported
# here and not only in ~/.config/mcp-agent-mail/config.env (which keeps the
# rest of the service settings).
STORAGE_ROOT = "{{ env.HOME }}/proj/share/agent-mail/git_mailbox_repo"

[dotfiles]
"~/proj/share/agent-mail/.keep" = { content = "" }
"~/proj/share/cass/.keep" = { content = "" }
"~/proj/share/cass-memory/.keep" = { content = "" }

[tools]
"github:Dicklesworthstone/ntm" = "1.35.1"
"github:Dicklesworthstone/beads_rust" = "0.6.0"
"github:Dicklesworthstone/beads_viewer" = "0.25.0"
"github:Dicklesworthstone/mcp_agent_mail_rust" = "0.3.36" # ships `am` and `mcp-agent-mail`
"github:Dicklesworthstone/destructive_command_guard" = "0.14.4"
"github:Dicklesworthstone/ultimate_bug_scanner" = { version = "5.4.9", asset_pattern = "ubs" }
"github:Dicklesworthstone/coding_agent_session_search" = "0.9.0"
"github:Dicklesworthstone/repo_updater" = { version = "1.3.1", asset_pattern = "ru" }
"github:Dicklesworthstone/jeffreysprompts.com" = "1.0.3"
"github:Dicklesworthstone/brenner_bot" = "0.4.1"
"github:Dicklesworthstone/storage_ballast_helper" = "0.6.2"
"github:Dicklesworthstone/aadc" = "0.1.1"
# pi: minimal agent harness for one-shot LLM calls (a prompt in, text out, no
# tools, no session). One profile per purpose under ~/.config/fw/pi/<name>,
# selected with PI_CODING_AGENT_DIR; `cm-llm` (the `cm` profile) is cass-memory's
# LLM. Reach for it instead of a full coding agent when a job only needs text.
"github:earendil-works/pi" = "0.87.1"
# AI client wiring: rulesync generates the clients' MCP servers and hooks
# (`ai:sync` below).
"npm:rulesync" = "17.0.0"
# mcp-proxy (punkpeye/mcp-proxy, TypeScript) serves a stdio-only MCP server to
# every client over HTTP as one shared daemon; unused while no such server is
# configured. Run it with `--host 127.0.0.1`: its default `::` exposes the
# server to the compose network.
# "npm:mcp-proxy" = "latest"

# cm (cass-memory) is built from the source tarball of a main commit: upstream
# publishes no linux-arm64 binary. The `http:` backend, because `github:`
# insists on a release for its SLSA check.
# A failed postinstall leaves the directory registered as installed; repair with
# `mise install --force "http:cass-memory"`.
[tools."http:cass-memory"]
version = "7423ed5be958d11459171657167dd999ad8e9fdb"
depends = ["bun"]
strip_components = 1
bin_path = "bin"
platforms.linux-x64.url = "https://github.com/Dicklesworthstone/cass_memory_system/archive/{{ version }}.tar.gz"
platforms.linux-arm64.url = "https://github.com/Dicklesworthstone/cass_memory_system/archive/{{ version }}.tar.gz"
postinstall = """
set -eu
cd "$MISE_TOOL_INSTALL_PATH"
# --ignore-scripts: `sharp` would pull node + libvips, and it is patched out of
# the standalone binary anyway by the explicit patch step below.
bun install --frozen-lockfile --ignore-scripts
bun run scripts/patch-standalone-deps.mjs
bun build src/cm.ts --compile --outfile bin/cm
rm -rf node_modules
"""

# Services start with the first `mise activate` shell (auto = ["start"]) and
# survive the shell; never add "stop": these are shared services. Cron daemons
# take no `auto`: every new shell in a fresh project session starts its `auto`
# daemons that are not running, and a cron daemon is not running between runs,
# so each shell would run the job at once. The supervisor arms their schedules
# from the config mise registers.
# `mise daemons …` needs a project config in cwd (any directory with a
# mise.toml lists these global daemons too); `pitchfork list|status|logs <name>`
# works from anywhere. After editing a `run` line below, restart with
# `mise daemons restart <name>` from such a directory: it re-registers the
# daemon, while `pitchfork restart` reuses the command it already knows.
[daemons.agent-mail]
# --host 0.0.0.0: reachable from the host through the published compose port
# (localhost:8765) and the OrbStack domain; see ~/.config/mcp-agent-mail/config.env.
run = "exec am serve-http --no-tui --host 0.0.0.0 --port 8765 --path /mcp/"
dir = "~/proj/share/agent-mail"
env = { RUST_LOG = "info" }
ready_http = "http://127.0.0.1:8765/healthz"
health_http = { url = "http://127.0.0.1:8765/health", interval = "30s", timeout = "5s", retries = 3 }
retry = true
auto = ["start"]

[daemons.cm]
# cass-memory MCP server (JSON-RPC over HTTP POST at `/`); registered for every
# client next to Agent Mail by `mise run ai:sync` (~/.config/rulesync).
# Deliberately started without the LLM proxy key (no `fnox exec`): agents read
# memory and give feedback here, and the MCP `memory_reflect` fails, so
# reflection runs only in the cm-reflect job.
run = "exec cm serve --host 127.0.0.1 --port 8766"
ready_port = 8766
retry = true
auto = ["start"]

[daemons.sbh]
run = "exec sbh daemon"
retry = true
auto = ["start"]

# ntm's web dashboard and REST API for the host browser: http://localhost:7337.
# ntm serves without login only on loopback (auth mode `local`); on any other
# address it demands an API key, and then even the dashboard page answers 401
# in a browser. So ntm listens on 127.0.0.1:7338, and ntm-web-publish forwards
# the published port 7337 to it: the dashboard keeps its default API address
# (http://localhost:7337) and passes ntm's localhost origin check. Whoever
# reaches 7337 drives the agents' panes, with no login.
# From $HOME: ntm registers its working directory as an Agent Mail project.
[daemons.ntm-web]
run = "exec ntm web --port 7338"
dir = "~"
ready_http = "http://127.0.0.1:7338/health"
health_http = { url = "http://127.0.0.1:7338/health", interval = "30s", timeout = "5s", retries = 3 }
retry = true
auto = ["start"]

[daemons.ntm-web-publish]
run = "exec socat TCP-LISTEN:7337,fork,reuseaddr TCP:127.0.0.1:7338"
ready_port = 7337
retry = true
auto = ["start"]

# cass reads the agents' session files only when `cass index` runs; left alone
# it catches up only after a search finds the index 30 min stale, and answers
# that search from the old index. Upstream keeps it fresh with systemd timers
# (`cass schedule install`), which the container lacks, so pitchfork runs the
# same incremental pass (seconds, ~2 GB RSS while it runs). Not `index --watch`:
# it holds those ~2 GB for good. On a fresh VM the first run builds the whole
# index. A changed schedule needs `mise daemons restart cass-index`.
# --semantic embeds the new sessions too (~6 s a pass): without it the
# nightly vectors no longer match the database after the first new session,
# and cass turns semantic search off until the next night.
[daemons.cass-index]
run = "exec cass index --background --semantic"
env = { RUST_LOG = "warn" }
# pitchfork's cron takes seconds first; a 5-field expression is rejected.
cron = { schedule = "0 */5 * * * *", retrigger = "finish" }

# Daily at 10:05 local time: upstream's nightly job, a full index (rescans every
# session file, repairs stats, consolidates the lexical index) plus the semantic
# backfill: ~2 min and ~4.3 GB peak on ~130k messages, ~8 min the first time
# (it builds the hash tier for the whole archive). A wrapper retries a busy index
# lock and fails on any failed step. Run it by hand with `mise run fw:cass-nightly`.
[daemons.cass-nightly]
run = "exec ~/.config/mise/tasks/fw/cass-nightly"
env = { RUST_LOG = "warn" }
cron = { schedule = "0 5 10 * * *", retrigger = "finish" }

# Daily at 12:00: cass-memory's own reflection, the cron job its README
# suggests. cm picks the oldest unprocessed sessions of the lookback window
# (config.yaml) and learns rules through pi (`cm-llm`, key from fnox); 50 a day
# instead of the default 5 drains the backlog. A session that grew after its
# reflection is reflected again for the new part. cm saves the batch only at its
# end, so stopping a run loses all of it. From $HOME: all rules are global.
[daemons.cm-reflect]
run = "exec fnox exec -- cm reflect --max-sessions 50 --json"
dir = "~"
cron = { schedule = "0 0 12 * * *", retrigger = "finish" }

# Daily at 11:30: retire the Agent Mail identities of harness subagents that no
# subagent used for a day (am-subagent, wired as SubagentStart/SubagentStop
# hooks by rulesync), through the agent-mail daemon's MCP endpoint. Not
# `am agents reap`: it would retire busy ntm pane agents too (see am-subagent).
[daemons.am-subagent-reap]
run = "exec ~/.config/fw/bin/am-subagent reap http://127.0.0.1:8765/mcp/"
cron = { schedule = "0 30 11 * * *", retrigger = "finish" }

[tasks."fw:bootstrap"]
description = "One-time setup of the flywheel services (idempotent)"
# Daemons are not started here: services auto-start with the first activated
# shell, cron daemons run on their schedules, and `mise daemons start` needs a
# project config in cwd. Manual start of the services after that first shell:
# `pitchfork start agent-mail cm sbh ntm-web ntm-web-publish`.
# The default data dirs of cass and cass-memory become links into ~/proj/share
# (see [env]); a default dir holding anything but empty directories stops the
# bootstrap, its content is the owner's to move. The cass-memory config is the
# dotfile ~/.config/cass-memory/config.yaml, linked into the store again on
# every run; a config.json there (an older `cm init`) would shadow it, so it
# stops the bootstrap too. `cm init --no-interactive` skips the trauma scan and
# the per-project hook prompts.
# The trauma guard is cass-memory's own: `cm guard --install` writes the same
# script into every project apart from the store path it bakes in, so it is
# generated once in a throwaway project, refreshed on every run (a new cm
# brings its new guard), and rulesync registers it for Claude Code and Codex.
# The cass model is downloaded (~460 MB, SHA256-checked by cass) only when
# missing; the last check fails the bootstrap if it is still not installed.
run = """
set -eu
link_dir() { # link_dir <default data dir> <dir in ~/proj/share>
  [ -L "$1" ] && return
  [ ! -d "$1" ] || find "$1" -depth -type d -empty -delete
  if [ -e "$1" ]; then
    echo "fw:bootstrap: $1 is not empty; move its content into $2 and run again" >&2
    exit 1
  fi
  mkdir -p "$2" "$(dirname "$1")"
  ln -sT "$2" "$1"
}
link_dir "$HOME/.local/share/coding-agent-search" "$HOME/proj/share/cass"
link_dir "$HOME/.cass-memory" "$HOME/proj/share/cass-memory"
if [ -e "$HOME/.cass-memory/config.json" ]; then
  echo "~/.cass-memory/config.json shadows config.yaml; remove it" >&2
  exit 1
fi
ln -sfn "$HOME/.config/cass-memory/config.yaml" "$HOME/.cass-memory/config.yaml"
[ -d "$HOME/.cass-memory/diary" ] || cm init --no-interactive
guard_tmp="$(mktemp -d)"
mkdir "$guard_tmp/.claude"
(cd "$guard_tmp" && cm guard --install --json >/dev/null)
mkdir -p "$HOME/.claude/hooks"
install -m 755 "$guard_tmp/.claude/hooks/trauma_guard.py" "$HOME/.claude/hooks/trauma_guard.py"
rm -rf "$guard_tmp"
sbh config validate
sbh ballast provision
cass_model_installed() {
  cass models status --json | jq -e --arg m "${CASS_SEMANTIC_EMBEDDER:?}" \
    'any(.models[]; .registry_name == $m and .installed)' >/dev/null
}
cass_model_installed || cass models install --model "$CASS_SEMANTIC_EMBEDDER" --yes
cass_model_installed
"""

# Global file tasks: `[task_config] includes` is ignored in an env config file,
# an explicit `file =` per task works from any directory.
[tasks."fw:init"]
description = "Prepare a repository for the agent stack (idempotent)"
file = "{{ env.HOME }}/.config/mise/tasks/fw/init"

[tasks."ai:sync"]
description = "Generate MCP servers and hooks for every AI client (rulesync)"
# Source: ~/.config/rulesync. rulesync replaces only its own keys in each
# client's user-scope files (MCP server list, hook list) and keeps the rest.
# Runs after every `chezmoi apply` (run_after_200_ai-sync.sh), because chezmoi
# rewrites those files whole and drops the generated keys.
dir = "{{ env.HOME }}/.config/rulesync"
run = "rulesync generate"

[tasks."fw:doctor"]
description = "Smoke-check the flywheel agent stack (read-only)"
file = "{{ env.HOME }}/.config/mise/tasks/fw/doctor"

[tasks."fw:cass-index"]
description = "Build the cass session index from scratch (slow, run once)"
run = "cass index --full --json"

[tasks."fw:cass-nightly"]
description = "Daily cass job: full index + semantic backfill (the cass-nightly daemon)"
file = "{{ env.HOME }}/.config/mise/tasks/fw/cass-nightly"

[tasks."fw:cm-reflect"]
description = "Reflect agent sessions into the cass-memory playbook now (the cm-reflect daemon); extra args go to cm reflect, e.g. -- --days 90 --max-sessions 200"
dir = "~"
run = "fnox exec -- cm reflect --json"

# Flywheel agent stack (ported from acfs). Linux devcontainer only: this file is
# loaded through the `fw` entry of the env list in miserc.toml, so dropping `fw`
# there disables the whole stack. Every tool is a pinned upstream release; the
# only build is `cm` (no linux-arm64 asset upstream), see [tools.…cass_memory_system].
#
# Background services run under pitchfork (`mise daemons`), the only mise-native
# supervisor that works without systemd (PID 1 is tini in the container).
# Never run the upstream installers, `am service install`, `sbh install`,
# `dcg install` or `agy install`: chezmoi owns the configs, and the clients' MCP
# servers and hooks are generated by `mise run ai:sync` from ~/.config/rulesync.

# `{{ version }}` in `platforms.*.url` (the `cm` build below). On an older mise
# every command fails with "mise version … is required" instead of a 404 on a
# literal `v{{ version }}.tar.gz`; the chezmoi bootstrap script self-updates.
min_version = "2026.9.12"

[settings]
experimental = true # `mise daemons`

[env]
BV_NO_UPDATE_CHECK = "1"
CASS_DATA_DIR = "{{ env.HOME }}/proj/share/cass"
CASS_MEMORY_HOME = "{{ env.HOME }}/proj/share/cass-memory"
# Agent Mail archive location. Both the service and `am guard check` (the
# pre-commit guard) resolve it from the environment, so it has to be exported
# here and not only in ~/.config/mcp-agent-mail/config.env (which keeps the
# rest of the service settings).
STORAGE_ROOT = "{{ env.HOME }}/proj/share/agent-mail/git_mailbox_repo"

[dotfiles]
"~/proj/share/agent-mail/.keep" = { content = "" }
"~/proj/share/cass/.keep" = { content = "" }
"~/proj/share/cass-memory/.keep" = { content = "" }

[tools]
"github:Dicklesworthstone/ntm" = "1.35.1"
"github:Dicklesworthstone/beads_rust" = "0.6.0"
"github:Dicklesworthstone/beads_viewer" = "0.25.0"
"github:Dicklesworthstone/mcp_agent_mail_rust" = "0.3.36" # ships `am` and `mcp-agent-mail`
"github:Dicklesworthstone/destructive_command_guard" = "0.14.4"
"github:Dicklesworthstone/ultimate_bug_scanner" = { version = "5.4.9", asset_pattern = "ubs" }
"github:Dicklesworthstone/coding_agent_session_search" = "0.8.0"
"github:Dicklesworthstone/repo_updater" = { version = "1.3.1", asset_pattern = "ru" }
"github:Dicklesworthstone/jeffreysprompts.com" = "1.0.3"
"github:Dicklesworthstone/brenner_bot" = "0.4.1"
"github:Dicklesworthstone/storage_ballast_helper" = "0.6.2"
"github:Dicklesworthstone/aadc" = "0.1.1"
# AI client wiring: rulesync generates the clients' MCP servers and hooks
# (`ai:sync` below); morph-mcp (stdio only) is served to all of them over HTTP
# by mcp-proxy (punkpeye/mcp-proxy, TypeScript) as the `morph` daemon.
"npm:rulesync" = "17.0.0"
"npm:@morphllm/morphmcp" = "0.8.213"
"npm:mcp-proxy" = "6.7.19"

# cm (cass-memory) is built from the tagged source tarball: upstream publishes
# no linux-arm64 binary.
# A failed postinstall leaves the directory registered as installed; repair with
# `mise install --force "github:Dicklesworthstone/cass_memory_system"`.
[tools."github:Dicklesworthstone/cass_memory_system"]
version = "0.2.14"
depends = ["bun"]
strip_components = 1
bin_path = "bin"
platforms.linux-x64.url = "https://github.com/Dicklesworthstone/cass_memory_system/archive/refs/tags/v{{ version }}.tar.gz"
platforms.linux-arm64.url = "https://github.com/Dicklesworthstone/cass_memory_system/archive/refs/tags/v{{ version }}.tar.gz"
postinstall = """
set -eu
cd "$MISE_TOOL_INSTALL_PATH"
# --ignore-scripts: `sharp` would pull node + libvips, and it is patched out of
# the standalone binary anyway by the explicit patch step below.
bun install --frozen-lockfile --ignore-scripts
bun run scripts/patch-standalone-deps.mjs
bun build src/cm.ts --compile --outfile bin/cm
rm -rf node_modules
"""

# Daemons start with the first `mise activate` shell (auto = ["start"]) and
# survive the shell; never add "stop": these are shared services.
# `mise daemons …` needs a project config in cwd (any directory with a
# mise.toml lists these global daemons too); `pitchfork list|status|logs <name>`
# works from anywhere. After editing a `run` line below, restart with
# `mise daemons restart <name>` from such a directory: it re-registers the
# daemon, while `pitchfork restart` reuses the command it already knows.
[daemons.agent-mail]
# --host 0.0.0.0: reachable from the host through the published compose port
# (localhost:8765) and the OrbStack domain; see ~/.config/mcp-agent-mail/config.env.
run = "exec am serve-http --no-tui --host 0.0.0.0 --port 8765 --path /mcp/"
dir = "~/proj/share/agent-mail"
env = { RUST_LOG = "info" }
ready_http = "http://127.0.0.1:8765/healthz"
health_http = { url = "http://127.0.0.1:8765/health", interval = "30s", timeout = "5s", retries = 3 }
retry = true
auto = ["start"]

[daemons.cm]
# cass-memory MCP server (JSON-RPC over HTTP POST at `/`); registered for every
# client next to Agent Mail by `mise run ai:sync` (~/.config/rulesync).
run = "exec cm serve --host 127.0.0.1 --port 8766"
ready_port = 8766
retry = true
auto = ["start"]

[daemons.morph]
# WarpGrep code search for every client (`morph` in ~/.config/rulesync):
# `codebase_search` over a local repository and `github_codebase_search` over a
# public GitHub repository, both through the Morph API. One morph-mcp process
# serves all sessions: mcp-proxy keeps a single stdio child (supergateway starts
# one per request). That is safe for both tools: each searches the repository
# named in the call, independent of the process cwd and of MCP roots, which
# only the disabled file tools use.
# `fnox exec` decrypts MORPH_API_KEY for the daemon itself: the pitchfork
# supervisor keeps the environment of whichever process started it, and that
# one need not have loaded the fnox secrets. Without the key morph-mcp starts
# and answers `initialize`, but lists no tools.
# --host: the default `::` would expose the key-bearing server to the compose
# network. --server stream: Streamable HTTP at /mcp only, no SSE endpoint.
run = "exec fnox exec --replace -- mcp-proxy --host 127.0.0.1 --port 8767 --server stream -- morph-mcp"
env = { DISABLED_TOOLS = "edit_file,reflex_list,reflex_predict,reflex_summary,reflex_traces" }
ready_port = 8767
retry = true
auto = ["start"]

[daemons.sbh]
run = "exec sbh daemon"
retry = true
auto = ["start"]

[tasks."fw:bootstrap"]
description = "One-time setup of the flywheel services (idempotent)"
# Daemons are not started here: they auto-start with the first activated shell,
# and `mise daemons start` needs a project config in cwd. Manual start:
# `pitchfork start agent-mail cm morph sbh` after that first shell.
run = """
set -eu
[ -d "${CASS_MEMORY_HOME:?}/diary" ] || cm init
sbh config validate
sbh ballast provision
"""

# Global file tasks: `[task_config] includes` is ignored in an env config file,
# an explicit `file =` per task works from any directory.
[tasks."fw:init"]
description = "Prepare a repository for the agent stack (idempotent)"
file = "{{ env.HOME }}/.config/mise/tasks/fw/init"

[tasks."ai:sync"]
description = "Generate MCP servers and hooks for every AI client (rulesync)"
# Source: ~/.config/rulesync. rulesync replaces only its own keys in each
# client's user-scope files (MCP server list, hook list) and keeps the rest.
# Runs after every `chezmoi apply` (run_after_200_ai-sync.sh), because chezmoi
# rewrites those files whole and drops the generated keys.
dir = "{{ env.HOME }}/.config/rulesync"
run = "rulesync generate"

[tasks."fw:doctor"]
description = "Smoke-check the flywheel agent stack (read-only)"
file = "{{ env.HOME }}/.config/mise/tasks/fw/doctor"

[tasks."fw:cass-index"]
description = "Build the cass session index from scratch (slow, run once)"
run = "cass index --full --json"

[tools]

"npm:agent-browser" = "latest"
"npm:rulesync" = "36"
btop = '1.4'                   # upstream releases linux binaries only, macOS pours the bottle
opencode = "2.1"
codex = "0"
claude = "2.1"
just = "1"
ast-grep = "0.51"
agy = "1.5"                    # aqua:google-antigravity/antigravity-cli
pi = "1.5.0"

"npm:tokscale" = "latest"
# Pinned: the installed linux-arm64 binary is a local build that reads
# DEJA_EMBED_FLOOR, and an upgrade would replace it with one that does not.
# Upstream calibrates the floor itself from the release with #5980; then unpin
# and drop DEJA_EMBED_FLOOR. See ~/.config/deja/README.md, Upstream.
"npm:@vshulcz/deja-vu" = "0.24.1"

"github:Dicklesworthstone/repo_updater" = { version = "1.7.0", asset_pattern = "ru" }

[env]
# agy updates its own binary in place on start, inside mise's install dir, so
# the pin above would silently drift (1.2.7 became 1.2.10 on the first run).
AGY_CLI_DISABLE_AUTO_UPDATE = "1"
# deja's semantic tier: voyage-4-large through MongoDB's Voyage endpoint. Voyage
# does not take deja's `input_type` values, so the prefixes stand in for it and
# match its vectors. The model and the passage prefix name the sidecar: changing
# either embeds the whole history again. The key is DEJA_EMBED_KEY in fnox.
DEJA_EMBED_URL = "https://ai.mongodb.com/v1/embeddings"
DEJA_EMBED_MODEL = "voyage-4-large"
DEJA_EMBED_QUERY_PREFIX = "Represent the query for retrieving supporting documents: "
DEJA_EMBED_PASSAGE_PREFIX = "Represent the document for retrieval: "
# This model's best matches have a median cosine of .55, right at deja's default
# floor, while nine of ten queries with no answer stay under .44.
DEJA_EMBED_FLOOR = "0.40"
DEJA_NO_UPDATE_NOTICE = "1"
# No other DEJA_* hook switch is set on purpose: none made the hooks more useful,
# for subagents least (~/.config/deja/README.md, Hooks and subagents).

# Daily at 13:00: upload the whole usage history to tokscale.ai. Not `tokscale
# autosubmit enable`: its scheduler is a systemd user timer or a crontab, both
# absent in the container. `submit` takes TOKSCALE_API_TOKEN (fnox) before
# ~/.config/tokscale/credentials.json, so no `tokscale login` is needed.
[daemons.tokscale-submit]
run = "exec fnox exec -- tokscale submit"
dir = "~"
cron = { schedule = "0 0 13 * * *", retrigger = "finish" }

# Hourly: embed what is new since the last run. A run adds only new records but
# reads and rewrites the whole sidecar, so it is not worth running more often:
# lexical search finds a new session before it has vectors. `mise x` puts the
# DEJA_EMBED_* of [env] in front of deja, since a run with another model replaces
# every vector.
[daemons.deja-embed]
run = "exec fnox exec -- mise x -- deja embed"
dir = "~"
cron = { schedule = "0 0 * * * *", retrigger = "finish" }

[bootstrap.packages]
"apt:language-pack-en-base" = "latest"
"apt:coreutils" = "latest"
"apt:curl" = "latest"
"apt:git" = "latest"
"apt:gnupg" = "latest"
"apt:make" = "latest"
"apt:tig" = "latest"
"apt:tree" = "latest"
"apt:wget" = "latest"
"apt:zsh" = "latest"
"apt:sudo" = "latest"
"apt:lsof" = "latest"
"apt:libasound2t64" = "latest"         # libasound2t64
"apt:binutils" = "latest"              #jpackage
"apt:fakeroot" = "latest"              #jpackage
"apt:libc6" = "latest"                 #jpackage
"apt:imagemagick" = "latest"           #jpackage
"apt:gcc" = "latest"                   #jpackage
"apt:bubblewrap" = "latest"
"apt:keychain" = "latest"
"apt:socat" = "latest"                 # claude code

[settings]

yes = true

[tasks."ai:sync"]
description = "Generate MCP servers and hooks for every AI client (rulesync)"
# Source: ~/.config/rulesync. rulesync replaces only its own keys in each
# client's user-scope files (MCP server list, hook list) and keeps the rest.
# Runs after every `chezmoi apply` (run_after_200_ai-sync.sh), because chezmoi
# rewrites those files whole and drops the generated keys.
dir = "{{ env.HOME }}/.config/rulesync"
run = "rulesync generate"

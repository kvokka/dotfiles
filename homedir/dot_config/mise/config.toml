[env]

_.path = "./node_modules/.bin"

[tools]

nodejs = '26.8'
biome = '2.5'
bun = '1.4'
pnpm = '12.4.0'

"npm:aicommit2" = "latest"
"npm:@fission-ai/openspec" = { version = "1.13", postinstall = "openspec completion install zsh" }
"npm:rulesync" = "17.0.0" # global MCP servers and hooks for every AI client: `mise run ai:sync`
"aqua:fallow-rs/fallow" = "3.27"

golang = '1.27'

python = '3.14'
uv = '0.12'
ruff = '0.16'
ty = '0.0.81'
pipx = '1.16'

"pipx:hf" = "1.31"

prek = '0.5'
hadolint = '2.15'
shellcheck = '0.11'
gitleaks = '8.30'
rumdl = '0.2.70' # too often version bumps
vale = '3.14'

chezmoi = '2.72'
bat = '0.26'
delta = '0.19' # git pager, wired in ~/.config/git/config
gdu = '5.37' # ncdu has no release binaries at all
fzf = '0.74'
fd = '10.4'
jq = '1.8'
yq = '4.53'
ripgrep = '15.2'
direnv = '2.37'
zoxide = '0.10'
gh = '2.101.0'
oxlint = '1.82'
fnox = '1.35'

oras = '1.3'

sops = '3.13'
age = '1.3'

oh-my-posh = 'v31.2.1'

neovim = '0.12'

gcloud = 'latest'

docker-cli = '29.8'
terraform = '1.16'

atuin = '18.22'
lsd = '1.2'

tmux = '3.7c'
pitchfork = '2.27.0'

# agent-stack helpers that are useful on every OS; the rest of the stack is in config.fw.toml
"github:Dicklesworthstone/toon_rust" = "0.2.4"        # `toon` encoder for br/bv/ubs --format toon
"github:Dicklesworthstone/franken_markdown" = "0.4.5" # `fmd` markdown -> html/pdf
typos = "1.50"                                        # aqua:crate-ci/typos spell checker

cloc = { version = "2.10", bin = "cloc", asset_pattern = "cloc-{{ version }}.pl" }

# # # # # # extras
# rust = '1'
# kubectl = '1.31'
# kubeseal = '0.28'
# k9s = '0.40'
# git-cliff = '2.8'
# helm = '4'
# helm-diff = '3'

[dotfiles]
"~/.cache/terraform/plugin-cache/.keep" = { content = "" }

[settings]

minimum_release_age = "3d"
minimum_release_age_excludes = ["opencode", "claude", "codex", "aqua:openai/codex"]

npm.package_manager = "bun"

idiomatic_version_file_enable_tools = ["python", "ruby"]

trusted_config_paths = ["~/proj/active"]

[settings.pipx]
uvx = true

[settings.python]
uv_venv_auto = "source"

[tasks."openspec:setup:stores"]
description = "Setup all openspec stores"
run = """
for store in ~/proj/active/siam-platform; do
  [ -d "$store" ] || { echo "skip: $store does not exist"; continue; }
  openspec store register "$store"
done
"""

[tasks."ai:sync"]
description = "Generate global MCP servers and hooks for every AI client (rulesync)"
file = "{{ env.HOME }}/.config/mise/tasks/ai/sync"

[tasks.bootstrap]
description = "Global mise bootstrap"
run = [
  "mise run bootstrap:atuin",
  "mise run openspec:setup:stores",
  "mise run ai:sync",
  # flywheel stack (config.fw.toml) exists only in the Linux devcontainer
  "if mise tasks ls --json | jq -e 'any(.[]; .name == \"fw:bootstrap\")' >/dev/null; then mise run fw:bootstrap; fi",
]

[tasks."bootstrap:atuin"]
hide = true
run = """
[ -n "${ATUIN_KEY:-}" ] && [ -n "${ATUIN_PASSWORD:-}" ] || { echo "skip: no ATUIN_KEY/ATUIN_PASSWORD"; exit 0; }
atuin status >/dev/null 2>&1 || atuin login -u "${ATUIN_USERNAME:-kvokka}" -p "$ATUIN_PASSWORD" -k "$ATUIN_KEY"

# the plugin itself is managed by chezmoi (~/.oh-my-zsh/custom/plugins/atuin);
# only the version-specific completions are generated here
d="${ZSH_CUSTOM:-$HOME/.oh-my-zsh/custom}/plugins/atuin"
mkdir -p "$d"
atuin gen-completions --shell zsh --out-dir "$d"

atuin sync
"""

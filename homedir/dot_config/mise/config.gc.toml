# Gas City (gc) agent orchestrator with Beads (bd). Linux devcontainer only:
# loaded through the `gc` entry of the env list in miserc.toml.
#
# Services run under pitchfork (`mise daemons`): the container has no systemd,
# and `gc supervisor install` finds no user systemd and writes nothing.

# `mise daemons` needs a recent mise.
min_version = "2026.9.12"

[settings]
experimental = true # `mise daemons`

[vars]
# gc follows main: upstream's `edge` release ships only linux_amd64, so gc is
# built from this commit. Bump it to the head of main to update.
gc_commit = "084b3e7cc9127337b90275a289bd0b19f2ca3fa1"

[env]
# Usage metrics of gc and bd are on by default; both honour DO_NOT_TRACK.
DO_NOT_TRACK = "1"

# gc's home (city registry, supervisor state, pack cache) outlives the
# container: ~/.gc is a chezmoi symlink (symlink_dot_gc.tmpl) into
# ~/proj/share/gc. Not GC_HOME: a daemon or shell started without mise's
# environment would still use ~/.gc.
[dotfiles]
"~/proj/share/gc/.keep" = { content = "" }

[tools]
# Static build like the upstream release: with cgo on, go-icu-regex needs
# libicu-dev. main.commit is the supervisor's build id for binary-drift checks;
# a module build leaves it "unknown".
"go:github.com/gastownhall/gascity/cmd/gc" = { version = "{{ vars.gc_commit }}", install_env = { CGO_ENABLED = "0", GOFLAGS = "-ldflags=-X=main.commit={{ vars.gc_commit }}" } }
"github:gastownhall/beads" = "1.3.1-rc.2"
# Session provider of the cities (`[session] provider = "herdr"` in city.toml);
# gc starts and stops the herdr server of each city itself.
herdr = "0.9.2"
# bd's server mode and gc's bd provider need the dolt CLI (gc: 2.1.0 or newer).
# Never 2.2.4 to 2.3.1: some fresh databases answer every
# CALL DOLT_RESET('--hard') with "context canceled", which beads' own 2.2.0 pin
# avoids.
"aqua:dolthub/dolt" = "2.3.5"
# dcg guards the repositories that carry its hook (fw:init and this dotfiles
# repository); ~/.config/dcg holds its config. Never run `dcg install`.
"github:Dicklesworthstone/destructive_command_guard" = "0.14.4"

# Beads live in one gc city, with gc's default (proxied) store: no Dolt
# daemon here. bd starts a detached proxy and `dolt sql-server` per scope on
# first use, for the city (`<city>/.beads/dolt/hq`) and for each rig
# (`<rig>/.beads/dolt/<prefix>`, gitignored in the rig repository); they never
# exit on their own, and `gc stop` ends them. So the city and every rig
# repository sit on persistent storage (~/proj). Never set bd's shared-server
# mode (BEADS_DOLT_SHARED_SERVER, --shared-server): gc pins it off in its
# scopes, since it could merge two cities' `hq` databases.
#
# Setting up:
# - City: the repository gc-city (no remote yet), cloned to
#   ~/proj/active/gc-city; `gc start` there registers it with the supervisor.
#   It was made with `gc init --template gascity --providers claude,codex
#   --default-provider claude`, and its city.toml sets
#   `[session] provider = "herdr"` and `[daemon] auto_restart_on_drift = false`
#   (see gc-supervisor).
# - Rig: `gc rig add <repo> --prefix <unique>`. bd init commits `.beads/` into
#   the repository as `bd init: initialize beads issue tracking`; gc leaves a
#   `.gitignore` block, `dolt.shared-server: false` in `.beads/config.yaml` and
#   `.claude/skills/` (links into ~/.gc) uncommitted.
# - Own issues: plain `bd` inside the rig, with gc running or not.
# - Another rig's issues: only through gc, which needs the city registered
#   (from a rig: `--city <city>` or GC_CITY otherwise):
#   `gc bd show <id>` (scope from the id's prefix), `gc bd --rig <rig> list`,
#   `gc beads show <id>`, `gc ready` for all scopes. Plain `bd show <id>` of
#   another rig and cross-database `bd sql` find nothing: every scope is its
#   own Dolt server, and bd's proxied mode does no route lookup. gc's agents
#   get this from its gc-rigs and gc-work skills.

# The machine-wide supervisor of all cities registered in ~/.gc/cities.toml,
# API on 127.0.0.1:8372. pitchfork captures its output, so no tee into
# ~/.gc/supervisor.log (`pitchfork logs gc-supervisor`). On binary drift
# `gc start` kills the supervisor and forks a detached one next to pitchfork's:
# set `[daemon] auto_restart_on_drift = false` in each city.toml and restart
# with `pitchfork restart gc-supervisor` after a bump.
[daemons.gc-supervisor]
run = "exec gc supervisor run"
env = { GC_SUPERVISOR_LOG_TEE = "0" }
ready_http = "http://127.0.0.1:8372/health"
retry = true
auto = ["start"]

# gc's dashboard and API for the host browser: http://localhost:8372. The
# supervisor stays on 127.0.0.1:8372: bound to any other address it refuses
# writes without a write-auth key, and by default it accepts only loopback
# Host headers, which the host's `localhost:8372` is. So this forwarder listens on 8373, the port compose
# publishes as the host's 8372. Whoever reaches it drives the city, with no
# login.
[daemons.gc-supervisor-publish]
run = "exec socat TCP-LISTEN:8373,fork,reuseaddr TCP:127.0.0.1:8372"
ready_port = 8373
retry = true
auto = ["start"]

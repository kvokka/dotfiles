# Gas City (gc) agent orchestrator with Beads (bd). Linux devcontainer only:
# loaded through the `gc` entry of the env list in miserc.toml.
#
# Services run under pitchfork (`mise daemons`): the container has no systemd,
# and `gc supervisor install` finds no user systemd and writes nothing.

# `mise daemons` needs a recent mise.
min_version = "2026.9.12"

[settings]
experimental = true # `mise daemons`

[vars]
# gc follows main: upstream's `edge` release ships only linux_amd64, so gc is
# built from this commit. Bump it to the head of main to update.
gc_commit = "084b3e7cc9127337b90275a289bd0b19f2ca3fa1"

[env]
# Usage metrics of gc and bd are on by default; both honour DO_NOT_TRACK.
DO_NOT_TRACK = "1"

[dotfiles]
"~/proj/share/beads/.keep" = { content = "" }

[tools]
# Static build like the upstream release: with cgo on, go-icu-regex needs
# libicu-dev. main.commit is the supervisor's build id for binary-drift checks;
# a module build leaves it "unknown".
"go:github.com/gastownhall/gascity/cmd/gc" = { version = "{{ vars.gc_commit }}", install_env = { CGO_ENABLED = "0", GOFLAGS = "-ldflags=-X=main.commit={{ vars.gc_commit }}" } }
"github:gastownhall/beads" = "1.3.1-rc.2"
# Session provider of the cities (`[session] provider = "herdr"` in city.toml);
# gc starts and stops the herdr server of each city itself.
herdr = "0.9.2"
# bd's server mode and gc's bd provider need the dolt CLI (gc: 2.1.0 or newer).
# Never 2.2.4 to 2.3.1: some fresh databases answer every
# CALL DOLT_RESET('--hard') with "context canceled", which beads' own 2.2.0 pin
# avoids.
"aqua:dolthub/dolt" = "2.3.5"
# dcg guards the repositories that carry its hook (fw:init and this dotfiles
# repository); ~/.config/dcg holds its config. Never run `dcg install`.
"github:Dicklesworthstone/destructive_command_guard" = "0.14.4"

# The one Dolt server of every bd repository and gc city: gc's own topology,
# one server with a database per scope, each named after its prefix (a city's
# after --dolt-database). There is no merged view: a project reads another with
# `bd sql "select id, title from <database>.issues"`, or inside a city with
# `gc bd --rig <rig>` and `gc beads show <id>`. bd's shared-server mode
# (BEADS_DOLT_SHARED_SERVER, --shared-server) is bd-standalone only: gc pins it
# off in its scopes, since it could merge two cities' `hq` databases, and an
# external city initialised under it gets a `.beads/` without metadata.
# Not `bd dolt start`: it daemonizes, and `bd dolt stop` would then kill this
# daemon. root without a password, loopback only.
#
# Setting up a project on it:
# - Every prefix and city database name is unique on the server; `hq` is the
#   database gc gives a city by default, so never leave it to the default.
# - Plain repository:
#     bd init --server --external --server-port 3308 --prefix <unique> \
#       --skip-hooks --skip-agents
#   Without --server-port bd starts a Dolt of its own. Without the --skip flags
#   bd sets a local core.hooksPath (.beads/hooks, shadowing the managed global
#   hooks and gitleaks), writes agent files, and commits all of it with
#   --no-verify.
# - City: in a git repository (gc's bd context check wants one):
#     gc init --beads-target external --beads-transport direct \
#       --dolt-host 127.0.0.1 --dolt-port 3308 --dolt-database <unique> <city>
#   Without the external flags gc runs a managed Dolt of its own for the city.
#   Then in city.toml: `[session] provider = "herdr"` and
#   `[daemon] auto_restart_on_drift = false` (see gc-supervisor).
#   `gc doctor` warns "BdStore fallback … project_id could not be confirmed"
#   on external scopes: gc forks bd per operation there, slower but correct.
# - Rig: `gc rig add <path> --prefix <unique>`; it inherits the city endpoint.
#   bd's own cross-prefix routing (`bd show <other-id>`) misses gc's rigs: gc
#   writes routes.jsonl prefixes without the dash bd matches on.
[daemons.beads-dolt]
run = "mkdir -p dolt && cd dolt && exec dolt sql-server -H 127.0.0.1 -P 3308 --loglevel=warning"
dir = "~/proj/share/beads"
ready_port = 3308
retry = true
auto = ["start"]

# The machine-wide supervisor of all cities registered in ~/.gc/cities.toml,
# API on 127.0.0.1:8372. pitchfork captures its output, so no tee into
# ~/.gc/supervisor.log (`pitchfork logs gc-supervisor`). On binary drift
# `gc start` kills the supervisor and forks a detached one next to pitchfork's:
# set `[daemon] auto_restart_on_drift = false` in each city.toml and restart
# with `pitchfork restart gc-supervisor` after a bump.
[daemons.gc-supervisor]
run = "exec gc supervisor run"
env = { GC_SUPERVISOR_LOG_TEE = "0" }
ready_http = "http://127.0.0.1:8372/health"
retry = true
auto = ["start"]
